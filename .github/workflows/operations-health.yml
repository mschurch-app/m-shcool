name: School production health
on:
  push:
    branches: [main]
    paths:
      - 'operations/**'
      - '.github/workflows/operations-health.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-production-health
  cancel-in-progress: false
jobs:
  read-only-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Verify deployed assets and anonymous management denial
        run: node operations/health.mjs
