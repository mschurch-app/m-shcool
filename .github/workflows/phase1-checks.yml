name: Phase 1 safety checks

on:
  push:
    branches:
      - codex-takeover
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline safety and check-in tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install pinned offline database test dependency
        run: npm ci --prefix tests --ignore-scripts
      - name: Run offline tests
        run: node --test
