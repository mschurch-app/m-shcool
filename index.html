<!-- 5. 課輔與個別輔導紀錄 (完整原版個案工作台) -->
    <div id="tab-counseling" class="hidden space-y-6">
      <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">
        
        <!-- 頂部工具列 -->
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6">
          <div>
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-hand-holding-heart text-rose-600"></i> 個別學童課輔與身心輔導紀錄
            </h2>
            <p class="text-xs text-slate-400 mt-1">詳實記錄晤談重點、情緒陪伴、段考弱科補救與個案後續追蹤事項</p>
          </div>

          <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
            <!-- 依學生個案篩選 -->
            <select id="counsel-filter-student" onchange="filterCounselingList()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:border-blue-600">
              <option value="">全部學童輔導紀錄</option>
            </select>

            <!-- 依輔導向度篩選 -->
            <select id="counsel-filter-category" onchange="filterCounselingList()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:border-blue-600">
              <option value="">全部輔導向度</option>
              <option value="課業輔導">課業輔導 (段考複習/弱科)</option>
              <option value="情緒行為">情緒行為 (焦慮/同儕相處)</option>
              <option value="家庭關懷">家庭關懷 (單親/變故支持)</option>
              <option value="品格引導">品格引導 (常規/學習態度)</option>
            </select>

            <button onclick="openAddCounselingModal()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow flex items-center space-x-1.5">
              <i class="fa-solid fa-pen-nib"></i>
              <span>新增輔導紀錄</span>
            </button>
          </div>
        </div>

        <!-- 輔導統計看板 -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
          <div class="bg-rose-50/60 border border-rose-100 rounded-2xl p-3.5">
            <span class="text-xs text-rose-600 font-bold block">累計輔導次數</span>
            <span class="text-xl font-black text-rose-900" id="cs-stat-count">0 次</span>
          </div>
          <div class="bg-indigo-50/60 border border-indigo-100 rounded-2xl p-3.5">
            <span class="text-xs text-indigo-600 font-bold block">累計陪伴時長</span>
            <span class="text-xl font-black text-indigo-900" id="cs-stat-mins">0 分鐘</span>
          </div>
          <div class="bg-blue-50/60 border border-blue-100 rounded-2xl p-3.5">
            <span class="text-xs text-blue-600 font-bold block">受輔導學童數</span>
            <span class="text-xl font-black text-blue-900" id="cs-stat-students">0 位</span>
          </div>
          <div class="bg-amber-50/60 border border-amber-100 rounded-2xl p-3.5">
            <span class="text-xs text-amber-600 font-bold block">待後續追蹤個案</span>
            <span class="text-xl font-black text-amber-900" id="cs-stat-followup">0 案</span>
          </div>
        </div>

        <!-- 輔導紀錄列表 -->
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs sm:text-sm">
            <thead class="bg-slate-50 text-slate-500 border-b border-slate-100 font-bold">
              <tr>
                <th class="py-3 px-3">晤談時間</th>
                <th class="py-3 px-3">學號/姓名</th>
                <th class="py-3 px-3">輔導向度</th>
                <th class="py-3 px-3">輔導老師</th>
                <th class="py-3 px-3">時長</th>
                <th class="py-3 px-3">狀況描述與晤談要點</th>
                <th class="py-3 px-3">後續處置與追蹤重點</th>
                <th class="py-3 px-3 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="counseling-list" class="divide-y divide-slate-100 font-medium">
              <tr><td colspan="8" class="py-6 text-center text-slate-400">載入輔導紀錄中...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
